name: Send SMS

on:
  repository_dispatch:
    types: [sms]

jobs:
  send_sms_job:
    runs-on: ubuntu-latest
    steps:
      - name: Send SMS via Textbelt
        run: |
          curl -X POST https://textbelt.com/text \
          -d phone="${{ github.event.client_payload.phone }}" \
          -d message="${{ github.event.client_payload.message }}" \
          -d key=YOUR_TEXTBELT_KEY
